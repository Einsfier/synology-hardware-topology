  function getRelatedIds(nodeId) {
    if (!nodeId || nodeId === 'soc') return null;
    const set = new Set([nodeId]);
    let changed = true;
    while (changed) {
      changed = false;
      for (const l of links) {
        if (set.has(l.to) && !set.has(l.from)) { set.add(l.from); changed = true; }
      }
    }
    const down = new Set([nodeId]);
    changed = true;
    while (changed) {
      changed = false;
      for (const l of links) {
        if (down.has(l.from) && !down.has(l.to)) { down.add(l.to); set.add(l.to); changed = true; }
      }
    }
    return set;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawArrow(x, y, dir, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    if (dir === 'down') {
      ctx.moveTo(x, y); ctx.lineTo(x - 5, y - 9); ctx.lineTo(x + 5, y - 9);
    } else if (dir === 'right') {
      ctx.moveTo(x, y); ctx.lineTo(x - 9, y - 5); ctx.lineTo(x - 9, y + 5);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawGrid() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    for (let x = 0; x <= LOGICAL_W; x += 28) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, LOGICAL_H); ctx.stroke();
    }
    for (let y = 0; y <= LOGICAL_H; y += 28) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(LOGICAL_W, y); ctx.stroke();
    }
  }

    roundRect(s.x + 1, s.y + 1, s.w - 2, 30, 12);
    ctx.fill();

    ctx.fillStyle = '#93c5fd';
    ctx.font = '700 13px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillText(tr.socBanner, s.x + 16, s.y + 21, s.w - 32);

    ctx.fillStyle = '#cbd5e1';
    ctx.font = '11.5px ui-monospace, Menlo, "PingFang SC", sans-serif';
    ctx.fillText(tr.socSummary, s.x + 16, s.y + 53, s.w - 32);

    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(886, s.y + 68);
    ctx.lineTo(886, s.y + s.h - 4);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#a78bfa';
    ctx.font = '600 10.5px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillText(tr.socExtLabel, s.x + 16, s.y + 77, 815);
    ctx.fillStyle = '#34d399';
    ctx.fillText(tr.socIntLabel, 904, s.y + 77, 720);

    ctx.textAlign = 'center';
    for (const key in socPins) {
      const p = socPins[key];
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '600 10.5px ui-monospace, Menlo, "PingFang SC", sans-serif';
      ctx.fillText(tr.pins[key], p.x, p.y - 10, 180);

      ctx.beginPath();
      ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#0b111e';
      ctx.stroke();
    }
    ctx.textAlign = 'left';
  }

  function drawSpeedPill(cx, cy, bw, spec, color, compact = false, customW = null) {
    const w = customW || (compact ? 112 : 148);
    const h = compact ? 30 : 36;
    roundRect(cx - w / 2, cy - h / 2, w, h, 5);
    ctx.fillStyle = '#0d1526';
    ctx.fill();
    ctx.lineWidth = 1.1;
    ctx.strokeStyle = color;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#f8fafc';
    ctx.font = compact ? '700 10.2px ui-monospace, Menlo, sans-serif' : '700 11px ui-monospace, Menlo, sans-serif';
    ctx.fillText(bw, cx, cy - 1.5, w - 8);

    ctx.fillStyle = '#cbd5e1';
    ctx.font = compact ? '9.6px "Segoe UI", "PingFang SC", sans-serif' : '10px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillText(spec, cx, cy + 11, w - 8);
    ctx.textAlign = 'left';
  }

  function drawLinks(activeSet) {
    const specs = t().linkSpecs;
    for (const l of links) {
      const sp = specs[l.specKey];
      const isActive = !activeSet || (activeSet.has(l.from) && activeSet.has(l.to));
      ctx.save();
      ctx.globalAlpha = isActive ? 1 : 0.16;
      ctx.strokeStyle = l.color;
      ctx.lineWidth = (isActive && activeSet) ? l.width + 1.2 : l.width;
      if (l.dashed) ctx.setLineDash([6, 4]);

      const dst = getNode(l.to);

      if (l.pin) {
        const p = socPins[l.pin];
        const x2 = dst.x + dst.w / 2;
        const y2 = dst.y;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y + 4);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.setLineDash([]);
        drawArrow(x2, y2, 'down', l.color);
        drawSpeedPill((p.x + x2) / 2, (p.y + y2) / 2, sp.bw, sp.spec, l.color);
      } else if (l.mode === 'sata_drop') {
        const src = getNode(l.from);
        const x1 = l.srcX;
        const y1 = src.y + src.h;
        const x2 = dst.x + dst.w / 2;
        const y2 = dst.y;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        if (Math.abs(x1 - x2) > 1) {
          ctx.lineTo(x1, l.midY);
          ctx.lineTo(x2, l.midY);
        }
        ctx.lineTo(x2, y2);
        ctx.stroke();
        drawArrow(x2, y2, 'down', l.color);
        drawSpeedPill(x2, l.pillY, sp.bw, sp.spec, l.color, true, 122);
      }

      ctx.restore();
    }
  }

  function drawNodes(activeSet) {
    const trNodes = t().nodes;
    drawSoCNode(hoveredNode && hoveredNode.id === 'soc');

    for (const n of nodes) {
      if (n.type === 'soc') continue;
      const nt = trNodes[n.id];
      const isHover = hoveredNode && hoveredNode.id === n.id;
      const isActive = !activeSet || activeSet.has(n.id);
      const innerMaxW = n.w - 20;

      ctx.save();
      ctx.globalAlpha = isActive ? 1 : 0.25;

      roundRect(n.x, n.y, n.w, n.h, 8);
      ctx.fillStyle = n.type === 'hdd' ? '#111b2e' : (n.dashed ? '#0f1728' : COLORS.nodeBg);
      ctx.fill();

      ctx.lineWidth = isHover ? 2.2 : 1.3;
      ctx.strokeStyle = isHover ? COLORS.nodeHover : (n.color || COLORS.nodeBorder);
      if (n.dashed && !isHover) ctx.setLineDash([5, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = n.color;
      roundRect(n.x + 1, n.y + 1, n.w - 2, 4, 2);
      ctx.fill();

      if (n.type === 'chip') {
        ctx.fillStyle = n.color;
        ctx.font = '700 10.5px ui-monospace, Menlo, sans-serif';
        ctx.fillText(nt.bdf, n.x + 11, n.y + 21, innerMaxW);

        ctx.fillStyle = COLORS.textMain;
        ctx.font = '700 13.5px "Segoe UI", "PingFang SC", sans-serif';
        ctx.fillText(nt.title, n.x + 11, n.y + 40, innerMaxW);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '11px "Segoe UI", "PingFang SC", sans-serif';
        nt.lines.forEach((line, idx) => {
          ctx.fillText(line, n.x + 11, n.y + 60 + idx * 17, innerMaxW);
        });

        if (nt.badge) {
          const by = n.y + n.h - 27;
          roundRect(n.x + 9, by, n.w - 18, 20, 4);
          if (n.badgeLevel === 'crit') {
            ctx.fillStyle = COLORS.critBg;
            ctx.fill();
            ctx.strokeStyle = 'rgba(248, 113, 113, 0.45)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = COLORS.critText;
          } else if (n.badgeLevel === 'warn') {
            ctx.fillStyle = COLORS.warnBg;
            ctx.fill();
            ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = COLORS.warnText;
          } else if (n.badgeLevel === 'muted') {
            ctx.fillStyle = COLORS.mutedBg;
            ctx.fill();
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = COLORS.mutedText;
          } else {
            ctx.fillStyle = COLORS.okBg;
            ctx.fill();
            ctx.fillStyle = COLORS.okText;
          }
          ctx.font = '700 10.2px "Segoe UI", "PingFang SC", sans-serif';
          ctx.fillText(nt.badge, n.x + 14, by + 13.5, n.w - 28);
        }
      } else if (n.type === 'hdd') {
        ctx.fillStyle = n.color;
        ctx.font = '700 10.5px "Segoe UI", "PingFang SC", sans-serif';
        ctx.fillText(nt.bay, n.x + 12, n.y + 21, innerMaxW);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '700 14px "Segoe UI", sans-serif';
        ctx.fillText(nt.title, n.x + 12, n.y + 41, innerMaxW);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '11px "Segoe UI", "PingFang SC", sans-serif';
        nt.lines.forEach((line, idx) => {
          ctx.fillText(line, n.x + 12, n.y + 60 + idx * 16.5, innerMaxW);
        });
      }

      ctx.restore();
    }
  }

  function drawInfoPanels() {
    const tr = t();

    // Panel 1 (Middle Left): Architecture Highlights & Provenance
    roundRect(40, 556, 826, 158, 12);
    ctx.fillStyle = '#101829';
    ctx.fill();
    ctx.strokeStyle = '#24324d';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.fillStyle = '#38bdf8';
    ctx.font = '700 12.8px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillText(tr.panel1Title, 56, 582, 794);

    ctx.fillStyle = '#cbd5e1';
    ctx.font = '11.4px "Segoe UI", "PingFang SC", sans-serif';
    tr.panel1Lines.forEach((txt, i) => {
      ctx.fillText(txt, 56, 608 + i * 24.5, 794);
    });

    // Panel 2 (Bottom Left): Link Legend & Bottleneck Analysis
    roundRect(40, 738, 784, 250, 12);
    ctx.fillStyle = '#101829';
    ctx.fill();
    ctx.strokeStyle = '#24324d';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.fillStyle = '#f8fafc';
    ctx.font = '700 13px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillText(tr.panel2Title, 56, 764, 752);

    const legendMeta = [
      { color: COLORS.pcie1x1,  x: 56,  y: 790, maxW: 330 },
      { color: COLORS.sata,     x: 432, y: 790, maxW: 340 },
      { color: COLORS.internal, x: 56,  y: 814, maxW: 330, dashed: true },
      { color: COLORS.unused,   x: 432, y: 814, maxW: 340, dashed: true }
    ];

    ctx.font = '600 11.2px "Segoe UI", "PingFang SC", sans-serif';
    legendMeta.forEach((it, idx) => {
      ctx.save();
      ctx.strokeStyle = it.color;
      ctx.lineWidth = 3.2;
      if (it.dashed) ctx.setLineDash([5, 3]);
      ctx.beginPath();
      ctx.moveTo(it.x, it.y - 4);
      ctx.lineTo(it.x + 26, it.y - 4);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#e2e8f0';
      ctx.fillText(tr.legend[idx], it.x + 34, it.y, it.maxW);
    });

    ctx.strokeStyle = 'rgba(148, 163, 184, 0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(56, 832);
    ctx.lineTo(808, 832);
    ctx.stroke();

    const noteColors = [COLORS.critText, COLORS.warnText, COLORS.okText];
    let ny = 856;
    tr.notes.forEach((nt, idx) => {
      ctx.fillStyle = noteColors[idx];
      ctx.font = '700 11.5px "Segoe UI", "PingFang SC", sans-serif';
      ctx.fillText(nt.title, 56, ny, 752);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px "Segoe UI", "PingFang SC", sans-serif';
      ctx.fillText(nt.text, 56, ny + 17, 752);
      ny += 45;
    });

    // Panel 3 (Bottom Right): System Overview, Transcoding & Upgrade Potential
    roundRect(848, 738, 792, 250, 12);
    ctx.fillStyle = '#101829';
    ctx.fill();
    ctx.strokeStyle = '#24324d';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.fillStyle = '#f8fafc';
    ctx.font = '700 13px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillText(tr.panel3Title, 864, 764, 760);

    let ry = 796;
    tr.panel3Lines.forEach((item) => {
      roundRect(864, ry - 14, 84, 21, 4);
      ctx.fillStyle = 'rgba(56, 189, 248, 0.14)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = '#7dd3fc';
      ctx.font = '700 10.5px "Segoe UI", "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(item.label, 906, ry, 76);
      ctx.textAlign = 'left';

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '11.4px "Segoe UI", "PingFang SC", sans-serif';
      ctx.fillText(item.text, 960, ry, 664);

      ry += 48;
    });
  }

  function syncToolbarUI() {
    const tr = t();
    document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
    document.title = tr.pageTitle;
    navHome.textContent = tr.navHome;
    uiTitle.textContent = tr.toolbarTitle;
    uiSubtitle.textContent = tr.toolbarSub;
    btnExport.textContent = tr.exportBtn;
    uiFooter.innerHTML = '<a href="https://github.com/Einsfier/synology-hardware-topology" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;color:#94a3b8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>Einsfier/synology-hardware-topology</a>';
    footerHome.textContent = tr.footerHome;
    btnZh.classList.toggle('active', currentLang === 'zh');
    btnEn.classList.toggle('active', currentLang === 'en');
  }

  function render() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = LOGICAL_W * dpr;
    canvas.height = LOGICAL_H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawGrid();
    drawHeader();
    drawEnclosures();
    drawInfoPanels();

    const activeNode = pinnedNode || hoveredNode;
    const activeSet = activeNode ? getRelatedIds(activeNode.id) : null;
    drawLinks(activeSet);
    drawNodes(activeSet);

    ctx.fillStyle = '#64748b';
    ctx.font = '11px ui-monospace, Menlo, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('github.com/Einsfier/synology-hardware-topology', LOGICAL_W - 40, LOGICAL_H - 13);
    ctx.textAlign = 'left';
  }

  function setLang(lang) {
    if (lang !== 'zh' && lang !== 'en') return;
    currentLang = lang;
    try { localStorage.setItem('syno_topo_lang', lang); } catch (_) {}
    pinnedNode = null;
    hoveredNode = null;
    tooltip.style.display = 'none';
    syncToolbarUI();
    render();
  }

  function hitTest(mx, my) {
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      if (mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) return n;
    }
    return null;
  }

  function updateTooltip(node, clientX, clientY) {
    if (!node) {
      tooltip.style.display = 'none';
      return;
    }
    const tr = t();
    const nt = tr.nodes[node.id];
    if (!nt || !nt.meta) {
      tooltip.style.display = 'none';
      return;
    }
    const m = nt.meta;
    const k = tr.ttKeys;
    let html = `<div class="tt-title">${nt.title}</div>`;
    if (m.bdf) html += `<div class="tt-bdf">${m.bdf}</div>`;
    if (m.cap) html += `<div class="tt-row"><span class="tt-key">${k.cap}</span><span class="tt-val">${m.cap}</span></div>`;
    if (m.sta) html += `<div class="tt-row"><span class="tt-key">${k.sta}</span><span class="tt-val">${m.sta}</span></div>`;
    if (m.driver) html += `<div class="tt-row"><span class="tt-key">${k.driver}</span><span class="tt-val">${m.driver}</span></div>`;
    if (m.detail) html += `<div style="margin-top:6px;color:#cbd5e1;font-size:11.5px;">${m.detail}</div>`;
    if (m.warn) html += `<div class="tt-warn">⚠ ${m.warn}</div>`;
    if (m.crit) html += `<div class="tt-crit">⛔ ${m.crit}</div>`;

    tooltip.innerHTML = html;
    tooltip.style.display = 'block';

    const rect = wrap.getBoundingClientRect();
    const ttW = tooltip.offsetWidth || 340;
    const ttH = tooltip.offsetHeight || 180;
    let left = clientX - rect.left + 16;
    let top = clientY - rect.top + 16;
    if (left + ttW + 10 > rect.width) left = clientX - rect.left - ttW - 16;
    if (top + ttH + 10 > rect.height) top = clientY - rect.top - ttH - 16;
    left = Math.max(8, Math.min(left, Math.max(8, rect.width - ttW - 8)));
    top = Math.max(8, Math.min(top, Math.max(8, rect.height - ttH - 8)));
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }

  function getLogicalCoords(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      mx: (e.clientX - rect.left) * (LOGICAL_W / rect.width),
      my: (e.clientY - rect.top) * (LOGICAL_H / rect.height)
    };
  }

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || pinnedNode) return;
    const { mx, my } = getLogicalCoords(e);
    const hit = hitTest(mx, my);
    canvas.style.cursor = hit ? 'pointer' : 'default';
    if (hit !== hoveredNode) {
      hoveredNode = hit;
      render();
    }
    updateTooltip(hit, e.clientX, e.clientY);
  });

  canvas.addEventListener('pointerdown', (e) => {
    const { mx, my } = getLogicalCoords(e);
    const hit = hitTest(mx, my);
    if (!hit) {
      if (pinnedNode || hoveredNode) {
        pinnedNode = null;
        hoveredNode = null;
        tooltip.style.display = 'none';
        render();
      }
      return;
    }
    if (pinnedNode && pinnedNode.id === hit.id) {
      pinnedNode = null;
      if (e.pointerType !== 'mouse') {
        hoveredNode = null;
        tooltip.style.display = 'none';
      }
    } else {
      pinnedNode = hit;
      hoveredNode = hit;
      updateTooltip(hit, e.clientX, e.clientY);
    }
    render();
  });

  canvas.addEventListener('pointerleave', (e) => {
    if (e.pointerType !== 'mouse' || pinnedNode) return;
    hoveredNode = null;
    tooltip.style.display = 'none';
    render();
  });

  document.addEventListener('pointerdown', (e) => {
    if (pinnedNode && !wrap.contains(e.target)) {
      pinnedNode = null;
      hoveredNode = null;
      tooltip.style.display = 'none';
      render();
    }
  });

  btnZh.addEventListener('click', () => setLang('zh'));
  btnEn.addEventListener('click', () => setLang('en'));

  btnExport.addEventListener('click', () => {
    pinnedNode = null;
    hoveredNode = null;
    tooltip.style.display = 'none';
    render();
    const link = document.createElement('a');
    link.download = t().exportName;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  window.addEventListener('resize', render);
  syncToolbarUI();
  render();
})();
</script>
</body>
</html>
