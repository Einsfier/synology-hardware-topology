  function renderLines(lines, isMono = false) {
    const cls = isMono ? ' mono' : '';

    return `<div class="cell-stack"><div class="cell-main${cls}">${lines[0]}</div><div class="cell-sub${cls}">${lines[1]}</div></div>`;

  function showTip(el, title, desc) {
    if (!title && !desc) { lineTip.style.display = 'none'; return; }
    lineTip.innerHTML = `<div class="lt-title">${title}</div><div>${desc}</div>`;
    lineTip.style.display = 'block';
    const bRect = el.getBoundingClientRect();
    const tW = lineTip.offsetWidth || 280;
    const tH = lineTip.offsetHeight || 64;
    let left = bRect.left + bRect.width / 2 - tW / 2;
    left = Math.max(12, Math.min(left, window.innerWidth - tW - 12));
    let top = bRect.bottom + 8;
    if (top + tH > window.innerHeight - 12) top = bRect.top - tH - 8;
    lineTip.style.left = left + 'px';
    lineTip.style.top = top + 'px';
  }

  function hideLineTip() {
    lineTip.style.display = 'none';
  }

  function render() {
    const tr = I18N[currentLang];
    document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
    document.title = tr.pageTitle;
    uiTitle.textContent = tr.title;
    uiSubtitle.textContent = tr.subtitle;
    uiContrib.textContent = tr.contribBtn;
    uiContrib.href = tr.contribHref;
    searchInput.placeholder = tr.searchPlaceholder;
    uiFooter.innerHTML = tr.footer;
    btnZh.classList.toggle('active', currentLang === 'zh');
    btnEn.classList.toggle('active', currentLang === 'en');

    filterPills.innerHTML = tr.filters.map(f =>
      `<button type="button" class="pill-btn ${activeFilter === f.id ? 'active' : ''}" data-filter="${f.id}">${f.label}</button>`
    ).join('');

    filterPills.querySelectorAll('button').forEach(btn => {
      const f = tr.filters.find(item => item.id === btn.dataset.filter);
      btn.addEventListener('click', () => {
        hideLineTip();
        activeFilter = btn.dataset.filter;
        render();
      });
      if (f && f.tipTitle) {
        btn.addEventListener('mouseenter', () => showTip(btn, f.tipTitle, f.tipDesc));
        btn.addEventListener('mouseleave', hideLineTip);
        btn.addEventListener('focus', () => showTip(btn, f.tipTitle, f.tipDesc));
        btn.addEventListener('blur', hideLineTip);
      }
    });

    const populatedLines = new Set(MODELS.map(m => m.line));
    const allLineBtn = `<button type="button" class="line-btn ${activeLine === 'all' ? 'active' : ''}" data-line="all">${tr.allLines}</button>`;
    const lineBtns = PRODUCT_LINES.map(pl => {
      const isSelected = activeLine === pl.id;
      const isEmpty = !populatedLines.has(pl.id);
      return `<button type="button" class="line-btn ${isSelected ? 'active' : ''} ${isEmpty ? 'empty-line' : ''}" data-line="${pl.id}" aria-pressed="${isSelected}">${pl.label[currentLang]}</button>`;
    }).join('');
    lineFilterBar.innerHTML = `${allLineBtn}${lineBtns}`;

    lineFilterBar.querySelectorAll('button').forEach(btn => {
      const lid = btn.dataset.line;
      const pl = PRODUCT_LINES.find(p => p.id === lid);
      btn.addEventListener('click', () => {
        hideLineTip();
        activeLine = (lid === 'all' || activeLine === lid) ? 'all' : lid;
        render();
      });
      if (pl) {
        btn.addEventListener('mouseenter', () => showTip(btn, pl.tipTitle[currentLang], pl.tipDesc[currentLang]));
        btn.addEventListener('mouseleave', hideLineTip);
        btn.addEventListener('focus', () => showTip(btn, pl.tipTitle[currentLang], pl.tipDesc[currentLang]));
        btn.addEventListener('blur', hideLineTip);
      }
    });

    const q = searchQuery.trim().toLowerCase();
    const filtered = MODELS.filter(m => {
      if (activeFilter !== 'all' && m.status !== activeFilter) return false;
      if (activeLine !== 'all' && m.line !== activeLine) return false;
      if (!q) return true;
      const hay = `${m.name} ${m.released || ''} ${m.line} ${m.soc.join(' ')} ${m.pcie[currentLang].join(' ')} ${m.bays[currentLang].join(' ')} ${m.nvme} ${m.nic[currentLang].join(' ')} ${m.exp[currentLang].join(' ')} ${m.searchText}`.toLowerCase();
      return hay.includes(q);
    }).sort((a, b) => (b.released || '').localeCompare(a.released || '') || a.name.localeCompare(b.name));

    uiCount.textContent = tr.countFmt(filtered.length, MODELS.length);
    tableHead.innerHTML = tr.cols.map(c => `<th>${c}</th>`).join('');

    if (filtered.length === 0) {
      tableBody.innerHTML = `<tr><td class="empty-cell" colspan="${tr.cols.length}">${tr.empty}</td></tr>`;
      return;
    }

    tableBody.innerHTML = filtered.map(m => {
      const badgeCls = m.status === 'verified' ? 'badge-verified' : 'badge-inferred';
      const badgeTxt = m.status === 'verified' ? tr.badgeVerified : tr.badgeInferred;
      const modelCell = m.released
        ? `<div class="cell-stack"><a class="model-link" href="${m.href}">${m.name}</a><div class="model-date">${m.released}</div></div>`
        : `<a class="model-link" href="${m.href}">${m.name}</a>`;
      return `
        <tr class="model-row" data-href="${m.href}">
          <td>${modelCell}</td>
          <td>${renderLines(m.soc, true)}</td>
          <td>${renderLines(m.pcie[currentLang], true)}</td>
          <td>${renderLines(m.bays[currentLang])}</td>
          <td class="mono">${m.nvme}</td>
          <td>${renderLines(m.nic[currentLang])}</td>
          <td>${renderLines(m.exp[currentLang])}</td>
          <td><span class="badge ${badgeCls}" data-status="${m.status}">${badgeTxt}</span></td>
        </tr>
      `;
    }).join('');

    tableBody.querySelectorAll('.badge[data-status]').forEach(badge => {
      const f = tr.filters.find(item => item.id === badge.dataset.status);
      if (f && f.tipTitle) {
        badge.addEventListener('mouseenter', () => showTip(badge, f.tipTitle, f.tipDesc));
        badge.addEventListener('mouseleave', hideLineTip);
      }
    });

    tableBody.querySelectorAll('tr.model-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('a')) return;
        window.location.href = row.dataset.href;
      });
    });
  }

  function setLang(lang) {
    if (lang !== 'zh' && lang !== 'en') return;
    currentLang = lang;
    try { localStorage.setItem('syno_topo_lang', lang); } catch (_) {}
    render();
  }

  btnZh.addEventListener('click', () => setLang('zh'));
  btnEn.addEventListener('click', () => setLang('en'));
  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    render();
  });

  render();
})();
</script>
</body>
</html>
